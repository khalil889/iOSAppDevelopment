services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: tourguide-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tourguide}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tourguide}
      POSTGRES_DB: ${POSTGRES_DB:-tourguide}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tourguide} -d ${POSTGRES_DB:-tourguide}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
